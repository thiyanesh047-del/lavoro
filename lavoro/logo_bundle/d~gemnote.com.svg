<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 192 192" width="192" height="192">
  <!-- Theme-aware gemnote 'gn' mark: cream mark on a dark tile in dark
       browser chrome, dark mark on a cream tile in light chrome. Both
       delivered variants are embedded and swapped with prefers-color-scheme
       so a single file drives the theme behaviour on every entry point. -->
  <style>
    .light { display: none; }
    @media (prefers-color-scheme: light) {
      .dark { display: none; }
      .light { display: inline; }
    }
  </style>
  <image class="dark" width="192" height="192" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
  <image class="light" width="192" height="192" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
</svg>

<!-- LP symbol-only mark, for favicons and app icons (brand: symbol-only is
     approved for these contexts). Artwork is the Icon - Dark mark, unmodified.
     The mark's own silhouette is a 48x48 rounded square (r=6.4, taken from the
     path data) and its arcs are negative space, so on a dark browser tab strip
     the whole tile would sink into the chrome. The Parchment 300 plate behind it
     makes the icon opaque and self-contained: it reads on light and dark chrome
     without relying on prefers-color-scheme, which Chrome ignores inside an

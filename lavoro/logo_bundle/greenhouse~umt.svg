<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="45" fill="#0f4c75"/>
  <circle cx="50" cy="50" r="40" fill="#1b6ba3" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Longitude lines -->
  <ellipse cx="50" cy="50" rx="40" ry="15" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <ellipse cx="50" cy="50" rx="40" ry="28" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <ellipse cx="50" cy="50" rx="15" ry="40" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <ellipse cx="50" cy="50" rx="28" ry="40" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  
  <!-- Latitude lines -->
  <line x1="10" y1="50" x2="90" y2="50" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="18" y1="30" x2="82" y2="30" stroke="#ffffff" stroke-width="1"/>
  <line x1="18" y1="70" x2="82" y2="70" stroke="#ffffff" stroke-width="1"/>
</svg>

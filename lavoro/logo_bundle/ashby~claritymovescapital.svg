<!-- Clarity favicon mark — "Favicon Alt" from Clarity Brand Guidelines 2026 (Figma node 2147-370).
     Authored on a 32-unit integer grid rather than the brand file's own units: at tab sizes every
     edge has to land on a pixel, or crispEdges snaps the seven bars unevenly and the spacing
     visibly drifts (FDN-2232). The geometry is favicon.ico's 32×32 bitmap, expressed as vector.
     Colours are inlined because an icon file renders outside the document and cannot read
     CSS custom properties. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#fffaf4" />
  <g fill="#282424">
    <rect x="3" y="3" width="2" height="26" />
    <rect x="7" y="3" width="2" height="26" />
    <rect x="11" y="3" width="2" height="26" />
    <rect x="15" y="3" width="2" height="26" />
    <rect x="19" y="3" width="2" height="26" />
    <rect x="23" y="3" width="2" height="26" />
    <rect x="27" y="3" width="2" height="26" />
  </g>
</svg>

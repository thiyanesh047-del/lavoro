# Lavoro — your settings. On first run this file is copied to config.yaml, which is yours (never committed).
# Easiest: ask Claude in this folder to "set up Lavoro for me" and it fills this in with you.

me:
  name: "Your Name"                 # used to sign drafted emails
  email: ""                         # your Gmail address (only used for Gmail drafts)
  portfolio: ""                     # your portfolio / personal site, linked under your name in emails
  linkedin: ""                      # your LinkedIn URL, linked under your name in emails
  profile_file: profile.md          # your CV / LinkedIn text; Claude scores jobs and writes emails from it

search:
  # Where to look: sweden | nordics | europe | asia | worldwide, or custom = your own locations_include list below.
  # The daily run uses this; a one-off run can override it: python -m lavoro run --region europe
  region: custom
  # A job passes the cheap filter if its title contains ANY of these (case-insensitive).
  titles_include:
    - software engineer
    - data scientist
    - machine learning
  # ...and contains NONE of these.
  titles_exclude:
    - senior
    - staff
    - principal
    - director
    - vp
    - vice president
    - head of
    - lead
  # Skip staffing / recruitment agencies (you want the employer, not a middleman).
  companies_exclude: [randstad, manpower, adecco, experis, hays, robert half, michael page]
  # A job passes if its location contains ANY of these, or it is remote and remote_ok is true.
  locations_include: [london, berlin]
  remote_ok: true
  remote_regions: [europe, emea, eu, worldwide, anywhere, global]
  max_age_days: 30
  # Ads on a company's own job board stay up while the role is open, so they have no age limit (0).
  board_max_age_days: 0

  # Sweden only: the public Platsbanken / JobTech API. Free, no key, covers almost every ad in Sweden.
  jobtech:
    enabled: false
    queries: ["software engineer", "data scientist"]
    regions: []        # e.g. ["01"] = Stockholms län. Empty = whole Sweden.
    limit_per_query: 100

  # Hacker News monthly "Who is hiring?" thread: startup posts, often with the founder's email.
  # Arbeitnow: free public job API, Europe-focused (Germany, NL, CH, FR, UK…). Off for region: asia.
  arbeitnow:
    enabled: true
    pages: 3         # 300 newest jobs per page; keep it low, it's a free service

  # Claude searches the open web for postings the boards above miss: company career pages, local job sites and
  # LinkedIn job listings. It reads search results only; LinkedIn pages are never opened. One Claude call per run.
  web:
    enabled: true
    max_results: 25

  # Companies in your region that announced a funding round lately. They tend to hire next. Once a week.
  funding:
    enabled: true
    refresh_days: 7
    max: 8

  hn:
    enabled: true
    months: 1        # how many recent threads to read

  # Y Combinator companies that are hiring, used to seed the company list.
  yc:
    enabled: true
    regions: [Europe, Fully Remote, Remote]   # used with region: custom; e.g. "United States of America", "Germany"
    refresh_days: 7   # the daily run re-reads the YC list and finds new job boards once a week

llm:
  # claude_cli = use the `claude` command (Claude Code) logged in with your Claude plan. No API key, no extra bill;
  #              it counts toward your plan's usage limits.
  # api        = Anthropic API with ANTHROPIC_API_KEY, billed per token.
  backend: claude_cli
  cli_model: ""                   # "" = your Claude Code default. Or: sonnet, opus, haiku
  model: claude-opus-5-5          # only used by backend: api
  score_effort: low
  draft_effort: medium
  max_jobs_to_score_per_run: 40   # caps AI work per run
  min_score: 7                    # 0–10; only jobs at or above this get contacts + drafts
  min_score_without_claude: 4     # threshold for the rough keyword score used when Claude is unavailable

contacts:
  max_jobs_per_run: 15            # how many top jobs get a contact lookup per run (the heaviest step)
  use_web_search: true            # let Claude search public pages for the hiring lead
  hunter_api_key_env: HUNTER_API_KEY   # optional: hunter.io key in this env var for verified emails

email:
  tone: "warm, direct, specific, no flattery, no buzzwords"
  max_words: 140
  language: auto                  # auto = the ad's language (English or Swedish), or name one, e.g. German
  gmail_drafts: false             # true = also save each draft in your Gmail Drafts folder (see README)

output_dir: output

# A desktop notification after the morning run ("2 new emails ready · 1 follow-up due"). Clicking it opens the
# site; start_site starts the site in the background first if it is not running. Test it: python -m lavoro notify --test
notify:
  enabled: true
  start_site: true
